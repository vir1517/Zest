<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ZEST Controller</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="controller-page controller-page-v3">
    <div class="ambient ambient-a"></div>
    <div class="ambient ambient-b"></div>

    <main class="mobile-ctrl">
      <section class="mobile-ctrl__shell panel">

        <!-- ── Header: title + START/QUIT ── -->
        <header class="mobile-ctrl__header">
          <div class="mobile-ctrl__copy">
            <p class="ctrl-eyebrow">ZEST</p>
            <h1 id="controllerTitle">Joining...</h1>
            <p id="controllerSubtitle" class="ctrl-sub">Connecting to host screen.</p>
          </div>
          <div class="mobile-ctrl__header-actions">
            <button id="startButton" class="ctrl-btn ctrl-btn--start" type="button">START</button>
            <button id="quitButton" class="ctrl-btn ctrl-btn--quit" type="button">QUIT</button>
          </div>
        </header>

        <!-- ── NAV MODE: D-pad for browsing the shelf ── -->
        <section id="navControls" class="mobile-ctrl__nav">
          <div class="dpad">
            <div class="dpad__row dpad__row--top">
              <button id="navUp" class="dpad__btn dpad__btn--dir" type="button">▲</button>
            </div>
            <div class="dpad__row dpad__row--mid">
              <button id="navLeft" class="dpad__btn dpad__btn--dir" type="button">◀</button>
              <button id="navSelect" class="dpad__btn dpad__btn--select" type="button">A</button>
              <button id="navRight" class="dpad__btn dpad__btn--dir" type="button">▶</button>
            </div>
            <div class="dpad__row dpad__row--bot">
              <button id="navDown" class="dpad__btn dpad__btn--dir" type="button">▼</button>
            </div>
          </div>
          <p class="ctrl-note">D-pad to browse · A to confirm · START to launch</p>
        </section>

        <!-- ── ARCADE SHOOTER: joystick + buttons ── -->
        <section id="shooterControls" class="mobile-ctrl__arcade hidden">
          <!-- LEFT: joystick -->
          <div class="mobile-ctrl__move-card mobile-ctrl__card">
            <p class="ctrl-label">MOVE</p>
            <div class="mobile-ctrl__stick" id="movePad">
              <div class="mobile-ctrl__stick-ring"></div>
              <div class="mobile-ctrl__stick-knob" id="moveKnob"></div>
            </div>
          </div>
          <!-- RIGHT: buttons -->
          <div class="mobile-ctrl__action-card mobile-ctrl__card">
            <p class="ctrl-label">ACTION</p>
            <div class="mobile-ctrl__menu-buttons">
              <button id="prevButton" class="ctrl-btn ctrl-btn--small" type="button">PREV</button>
              <button id="nextButton" class="ctrl-btn ctrl-btn--small" type="button">NEXT</button>
            </div>
            <button id="dashButton" class="ctrl-btn ctrl-btn--burst" type="button">BURST</button>
            <button id="fireButton" class="ctrl-btn ctrl-btn--fire" type="button">FIRE</button>
            <p id="arcadeNote" class="ctrl-note">Auto-aim on. PREV/NEXT browses shelf.</p>
          </div>
        </section>

        <!-- ── UNO: hand of cards ── -->
        <section id="unoPanel" class="mobile-ctrl__uno hidden">
          <div class="mobile-ctrl__card">
            <div class="uno-top">
              <div class="uno-top__info">
                <p class="ctrl-label">YOUR HAND</p>
                <h2 id="unoTurnLabel">Waiting...</h2>
                <p id="unoHint" class="ctrl-note">Cards appear when UNO starts.</p>
              </div>
              <div class="uno-top__actions">
                <button id="unoDrawButton" class="ctrl-btn ctrl-btn--draw" type="button">DRAW</button>
                <button id="unoPassButton" class="ctrl-btn ctrl-btn--small hidden" type="button">PASS</button>
              </div>
            </div>
            <div id="unoHand" class="mobile-ctrl__uno-hand"></div>
          </div>
        </section>

        <!-- ── UNO RESULT ── -->
        <section id="unoResultPanel" class="mobile-ctrl__result hidden">
          <div class="mobile-ctrl__card result-card">
            <p class="ctrl-label">ROUND OVER</p>
            <h2 id="unoResultTitle">Winner</h2>
            <p id="unoResultBody" class="ctrl-note">Choose what happens next.</p>
            <div class="result-actions">
              <button id="unoPlayAgainButton" class="ctrl-btn ctrl-btn--start" type="button">PLAY AGAIN</button>
              <button id="unoMenuButton" class="ctrl-btn ctrl-btn--quit" type="button">RETURN TO MENU</button>
            </div>
          </div>
        </section>

      </section><!-- /.mobile-ctrl__shell -->
    </main>

    <!-- Wild color picker overlay -->
    <div id="wildColorPicker" class="wild-picker hidden">
      <div class="wild-picker__card panel">
        <p class="ctrl-label">CHOOSE COLOR</p>
        <div class="wild-picker__grid">
          <button data-color="red"    class="mobile-ctrl__wild-button mobile-ctrl__wild-button--red"    type="button">RED</button>
          <button data-color="yellow" class="mobile-ctrl__wild-button mobile-ctrl__wild-button--yellow" type="button">YELLOW</button>
          <button data-color="green"  class="mobile-ctrl__wild-button mobile-ctrl__wild-button--green"  type="button">GREEN</button>
          <button data-color="blue"   class="mobile-ctrl__wild-button mobile-ctrl__wild-button--blue"   type="button">BLUE</button>
        </div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/controller.js"></script>
  </body>
</html>
